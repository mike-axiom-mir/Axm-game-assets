name: godot-rifle-contact-smoke

on:
  push:
    paths:
      - "native_hm08_humanoid_rig.py"
      - "native_attachment.py"
      - "native_hm08_rifle_contact_pose_v2.py"
      - "native_hm08_rifle_contact_pose_v2_test.py"
      - "native_hm08_rifle_contact_package.py"
      - "native_hm08_rifle_contact_package_test.py"
      - "engine/godot_face/render_rifle_contact_views.gd"
      - ".github/workflows/godot-rifle-contact-smoke.yml"
  pull_request:
    paths:
      - "native_hm08_humanoid_rig.py"
      - "native_attachment.py"
      - "native_hm08_rifle_contact_pose_v2.py"
      - "native_hm08_rifle_contact_pose_v2_test.py"
      - "native_hm08_rifle_contact_package.py"
      - "native_hm08_rifle_contact_package_test.py"
      - "engine/godot_face/render_rifle_contact_views.gd"
      - ".github/workflows/godot-rifle-contact-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-rifle-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build shared-rig rifle contact package
        run: |
          rm -rf engine/godot_face/generated
          python native_hm08_humanoid_rig_test.py
          python native_attachment_hand_socket_test.py
          python native_hm08_rifle_contact_pose_v2_test.py
          python native_hm08_rifle_contact_package_test.py
          python - <<'PY'
          from native_hm08_rifle_contact_package import build_hm08_rifle_contact_package
          package=build_hm08_rifle_contact_package("engine/godot_face/generated",texture_size=128)
          assert all(package["acceptance"].values()),package["acceptance"]
          assert package["schema"]=="axm.game-assets.hm08-rifle-contact-package.v0.2"
          assert package["pose"]["shared_rig"]["joint_count"]==23
          assert package["pose"]["truth"]["temporary_arm_only_skeleton_used"] is False
          assert package["pose"]["contact"]["support_position_error"]<1e-6
          assert package["delivery"]["primitive_count"]==5
          print("SHARED-RIG CONTACT PACKAGE PASS",package["acceptance"],package["pose"]["hand_visual_contact"])
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Render shared-rig rifle contact views
        run: |
          rm -f engine/godot_face/godot-rifle-contact-views-receipt.json engine/godot_face/godot-rifle-contact-*.png
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 640x640x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path engine/godot_face \
            --script render_rifle_contact_views.gd
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("engine/godot_face/godot-rifle-contact-views-receipt.json").read_text())
          assert receipt["status"]=="pass",receipt
          assert receipt["schema"]=="axm.game-assets.godot-rifle-contact-views.v0.1"
          assert receipt["surfaces"]==5 and receipt["material_surfaces"]==5,receipt
          assert [v["name"] for v in receipt["views"]]==["front_contact","three_quarter_contact","hands_close"]
          assert receipt["contact"]["support_position_error"]<1e-6
          for view in receipt["views"]:
              metrics=view["metrics"]
              assert metrics["foreground_coverage"]>=view["minimum_foreground_coverage"]
              assert metrics["near_white_foreground_fraction"]<=view["maximum_near_white_foreground_fraction"]
          print("GODOT SHARED-RIG RIFLE CONTACT PASS",[(v["name"],v["metrics"]["foreground_coverage"]) for v in receipt["views"]])
          PY

      - name: Bind contact captures to deterministic evidence
        env:
          GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from native_visual_evidence import build_capture_packet,validate_capture_packet,write_capture_packet
          root=Path("engine/godot_face")
          receipt=json.loads((root/"godot-rifle-contact-views-receipt.json").read_text())
          package_path=root/"generated"/"rifle-contact-package.json"
          package=json.loads(package_path.read_text())
          source_digest="sha256:"+hashlib.sha256(package_path.read_bytes()).hexdigest()
          bundle={
            "schema":"axm.game-assets.godot-shared-rig-rifle-contact-viewset.v0.1",
            "authority":"deterministic_capture_evidence_only",
            "asset_digest":package["delivery"]["gltf_sha256"],
            "pose_schema":package["pose"]["schema"],
            "joint_count":package["pose"]["shared_rig"]["joint_count"],
            "contact":receipt["contact"],
            "views":[],
            "truth":"Godot proves real import/render/capture for the shared 23-joint rifle-contact pose. Exact socket contact is deterministic evidence; shoulder/elbow/wrist appearance and visible hand wrap remain observational quality gates."
          }
          for view in receipt["views"]:
              name=view["name"]
              png_path=root/f"godot-rifle-contact-{name}.png"
              png=png_path.read_bytes(); metrics=view["metrics"]
              packet=build_capture_packet(
                png,
                asset_digest=package["delivery"]["gltf_sha256"],
                engine={"name":"Godot","version":receipt["godot_version"],"pinned_archive_sha256":os.environ["GODOT_ARCHIVE_SHA256"]},
                camera=view["camera"],
                render_settings={"renderer":"gl_compatibility","view_name":name,"world_bounds":receipt["world_bounds"],"layer":"shared_rig_rifle_contact_v0.2","lighting":receipt["lighting"],"foreground_gate":receipt["foreground_gate"]},
                metrics={"foreground_coverage":metrics["foreground_coverage"],"foreground_luma_mean":metrics["foreground_luma_mean"],"near_white_foreground_fraction":metrics["near_white_foreground_fraction"],"luma_min":metrics["luma_min"],"luma_max":metrics["luma_max"],"luma_mean":metrics["luma_mean"],"luma_range":metrics["luma_range"]},
                source_receipts=[source_digest],
              )
              assert validate_capture_packet(packet,png)["status"]=="pass"
              write_capture_packet(root/f"visual-capture-rifle-contact-{name}.json",packet)
              bundle["views"].append({"name":name,"capture_digest":packet["capture_digest"],"image_sha256":packet["image"]["sha256"]})
          (root/"visual-capture-rifle-contact-viewset.json").write_text(json.dumps(bundle,indent=2,sort_keys=True)+"\n")
          print("RIFLE CONTACT CAPTURE PASS",bundle)
          PY

      - name: Preserve shared-rig rifle contact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-rifle-contact-evidence
          if-no-files-found: error
          path: |
            engine/godot_face/godot-rifle-contact-views-receipt.json
            engine/godot_face/godot-rifle-contact-*.png
            engine/godot_face/visual-capture-rifle-contact-*.json
            engine/godot_face/generated/rifle-contact-package.json
            engine/godot_face/generated/sentinel_hm08_rifle_contact_v0_2.gltf
            engine/godot_face/generated/sentinel_hm08_rifle_contact_v0_2.bin
            engine/godot_face/generated/textures/**
