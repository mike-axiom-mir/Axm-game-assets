name: godot-smoke

on:
  push:
  pull_request:

jobs:
  godot-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate Forge weapon fixture
        run: |
          rm -rf engine/godot_smoke/generated
          python - <<'PY'
          from native_weapon_proof import build_weapon_proof
          proof = build_weapon_proof(
              "engine/godot_smoke/generated",
              texture_size=32,
              preview_size=32,
              seed=8801,
          )
          assert all(proof["acceptance"].values()), proof["acceptance"]
          print("FORGE FIXTURE PASS", proof["delivery"])
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parse and instantiate Forge glTF in Godot
        run: |
          rm -f engine/godot_smoke/godot-receipt.json
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path engine/godot_smoke \
            --script smoke.gd
          test -f engine/godot_smoke/godot-receipt.json
          cat engine/godot_smoke/godot-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("engine/godot_smoke/godot-receipt.json").read_text())
          assert receipt["status"] == "pass", receipt
          assert receipt["mesh_instances"] >= 1, receipt
          assert receipt["surfaces"] >= 1, receipt
          assert receipt["vertices"] > 0 and receipt["indices"] > 0, receipt
          assert receipt["material_surfaces"] >= 1, receipt
          print("GODOT RECEIPT PASS", receipt)
          PY

      - name: Render Forge asset in real Godot viewport
        run: |
          rm -f engine/godot_smoke/godot-render.png engine/godot_smoke/godot-render-receipt.json
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 640x640x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path engine/godot_smoke \
            --script render.gd
          test -s engine/godot_smoke/godot-render.png
          test -f engine/godot_smoke/godot-render-receipt.json
          cat engine/godot_smoke/godot-render-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("engine/godot_smoke/godot-render-receipt.json").read_text())
          assert receipt["status"] == "pass", receipt
          assert receipt["image"]["width"] == 640 and receipt["image"]["height"] == 640, receipt
          assert receipt["image"]["png_bytes"] > 1000, receipt
          assert receipt["foreground_coverage"] >= 0.015, receipt
          assert receipt["luma_range"] >= 0.10, receipt
          print("GODOT RENDER RECEIPT PASS", receipt)
          PY

      - name: Bind screenshot to deterministic visual capture packet
        env:
          GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from native_visual_evidence import build_capture_packet, validate_capture_packet, write_capture_packet

          root = Path("engine/godot_smoke")
          png_path = root / "godot-render.png"
          render_receipt = json.loads((root / "godot-render-receipt.json").read_text())
          weapon_path = root / "generated" / "weapon-proof.json"
          weapon_proof = json.loads(weapon_path.read_text())
          png = png_path.read_bytes()
          proof_digest = "sha256:" + hashlib.sha256(weapon_path.read_bytes()).hexdigest()

          packet = build_capture_packet(
              png,
              asset_digest=weapon_proof["delivery"]["gltf_sha256"],
              engine={
                  "name": "Godot",
                  "version": render_receipt["godot_version"],
                  "pinned_archive_sha256": os.environ["GODOT_ARCHIVE_SHA256"],
              },
              camera=render_receipt["camera"],
              render_settings={
                  "renderer": "gl_compatibility",
                  "render_target": render_receipt["render_target"],
                  "background_sample": render_receipt["background_sample"],
              },
              metrics={
                  "foreground_coverage": render_receipt["foreground_coverage"],
                  "luma_min": render_receipt["luma_min"],
                  "luma_max": render_receipt["luma_max"],
                  "luma_mean": render_receipt["luma_mean"],
                  "luma_range": render_receipt["luma_range"],
              },
              source_receipts=[proof_digest],
          )
          validation = validate_capture_packet(packet, png)
          assert validation["status"] == "pass", validation
          write_capture_packet(root / "visual-capture.json", packet)
          print("VISUAL CAPTURE PACKET PASS", packet["capture_digest"])
          PY
          cat engine/godot_smoke/visual-capture.json

      - name: Preserve engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-smoke-evidence
          if-no-files-found: warn
          path: |
            engine/godot_smoke/godot-receipt.json
            engine/godot_smoke/godot-render-receipt.json
            engine/godot_smoke/godot-render.png
            engine/godot_smoke/visual-capture.json
            engine/godot_smoke/generated/weapon-proof.json
            engine/godot_smoke/generated/sentinel_rifle.gltf
