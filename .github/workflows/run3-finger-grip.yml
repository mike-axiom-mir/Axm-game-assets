name: run3-finger-grip

on:
  push:
    paths:
      - "native_hm08_rifle_finger_grip.py"
      - "native_hm08_rifle_finger_grip_test.py"
      - "native_hm08_rifle_finger_grip_v2.py"
      - "native_hm08_rifle_finger_grip_v2_test.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_rifle_contact_pose_v4.py"
      - "native_weapon_human_scale.py"
      - ".github/workflows/run3-finger-grip.yml"
  pull_request:
    paths:
      - "native_hm08_rifle_finger_grip.py"
      - "native_hm08_rifle_finger_grip_test.py"
      - "native_hm08_rifle_finger_grip_v2.py"
      - "native_hm08_rifle_finger_grip_v2_test.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_rifle_contact_pose_v4.py"
      - "native_weapon_human_scale.py"
      - ".github/workflows/run3-finger-grip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-finger-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Gate source-grounded 53-joint finger rig
        run: python native_hm08_finger_rig_test.py
      - name: Preserve v0.5 rifle finger-wrap evidence
        run: python native_hm08_rifle_finger_grip_test.py
      - name: Diagnose penetration-bounded v0.6 digit state
        run: |
          python - <<'PY'
          from native_hm08_rifle_finger_grip_v2 import build_preferred_penetration_bounded_finger_grip
          _mesh, packet = build_preferred_penetration_bounded_finger_grip()
          for key, row in sorted(packet["digit_contact"].items()):
              print(key, {
                  "baseline_penetration_m": row["baseline_penetration_m"],
                  "final_penetration_m": row["final_penetration_m"],
                  "baseline_signed_surface_m": row["baseline_signed_surface_m"],
                  "final_signed_surface_m": row["final_signed_surface_m"],
                  "curl_strength": row["curl_strength"],
                  "curl_direction": row["curl_direction"],
              })
          PY
      - name: Gate penetration-bounded v0.6 finger wrap
        run: python native_hm08_rifle_finger_grip_v2_test.py
