name: hm08-full-body-seed

on:
  push:
    paths:
      - "tools/bootstrap_hm08_full_body.py"
      - "tools/bootstrap_hm08_full_body_test.py"
      - ".github/workflows/hm08-full-body-seed.yml"
      - "seed_data/hm08_head_v0.2/source-index-map.json"
      - "seed_data/hm08_upper_body_v0.1/source-index-map.json"
  pull_request:
    paths:
      - "tools/bootstrap_hm08_full_body.py"
      - "tools/bootstrap_hm08_full_body_test.py"
      - ".github/workflows/hm08-full-body-seed.yml"
      - "seed_data/hm08_head_v0.2/source-index-map.json"
      - "seed_data/hm08_upper_body_v0.1/source-index-map.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-full-body:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit-test full-body extraction
        run: python tools/bootstrap_hm08_full_body_test.py

      - name: Download pinned CC0 hm08 source data
        env:
          MH_REV: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          MPFB_REV: 437dd513888a92399d1d3200d2e80859fae55abc
        run: |
          set -euo pipefail
          rm -rf build/hm08-full-source build/hm08-full-body-seed
          mkdir -p build/hm08-full-source
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/makehumancommunity/makehuman/${MH_REV}/makehuman/data/3dobjs/base.obj" \
            -o build/hm08-full-source/base.obj
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/makehumancommunity/mpfb2/${MPFB_REV}/src/mpfb/data/mesh_metadata/hm08_config.json" \
            -o build/hm08-full-source/hm08_config.json
          for target in \
            "nose/nose-width1-incr.target" \
            "cheek/l-cheek-bones-incr.target" \
            "cheek/r-cheek-bones-incr.target"
          do
            out="build/hm08-full-source/$(basename "$target")"
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/makehumancommunity/makehuman/${MH_REV}/makehuman/data/targets/${target}" \
              -o "$out"
          done
          test "$(git hash-object build/hm08-full-source/base.obj)" = "d26635e9326e3cca30778fd7b9c00062b03cce09"
          test "$(git hash-object build/hm08-full-source/hm08_config.json)" = "f94e2731356232ed1b6306128fd04d18da5d21ea"

      - name: Derive complete continuous human body
        env:
          MH_REV: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          MPFB_REV: 437dd513888a92399d1d3200d2e80859fae55abc
        run: |
          python tools/bootstrap_hm08_full_body.py \
            --base-obj build/hm08-full-source/base.obj \
            --config-json build/hm08-full-source/hm08_config.json \
            --target build/hm08-full-source/nose-width1-incr.target \
            --target build/hm08-full-source/l-cheek-bones-incr.target \
            --target build/hm08-full-source/r-cheek-bones-incr.target \
            --required-head-source-map seed_data/hm08_head_v0.2/source-index-map.json \
            --required-upper-source-map seed_data/hm08_upper_body_v0.1/source-index-map.json \
            --output build/hm08-full-body-seed \
            --makehuman-revision "$MH_REV" \
            --mpfb-revision "$MPFB_REV"

      - name: Audit complete body topology and promoted-substrate inclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from native_geometry import read_obj, topology_report
          from native_targets import load_target, validate_target

          root = Path("build/hm08-full-body-seed")
          manifest = json.loads((root / "seed-manifest.json").read_text())
          assert all(manifest["acceptance"].values()), manifest["acceptance"]
          rel = manifest["relationship_to_promoted_substrates"]
          assert rel["head_source_subset"] is True, rel
          assert rel["upper_body_source_subset"] is True, rel
          assert rel["missing_head_source_vertices"] == [], rel
          assert rel["missing_upper_body_source_vertices"] == [], rel

          mesh = read_obj(root / "body.obj")
          topology = topology_report(mesh)
          assert topology["invalid_indices"] == 0, topology
          assert topology["degenerate_faces"] == 0, topology
          assert topology["nonmanifold_edges"] == 0, topology
          assert len(mesh.vertices) > 10185, "full body must contain more than upper body"
          assert len(mesh.faces) > 10158, "full body must contain more than upper body"

          for target_path in sorted((root / "targets").glob("*.target")):
              target = load_target(target_path, license="CC0-source-remap")
              assert target.metadata["basemesh"] == "axm-hm08-full-body-v0.1"
              report = validate_target(target, vertex_count=len(mesh.vertices))
              assert report["status"] == "pass", report
              assert report["rows"] > 0

          summary = {
              "vertices": len(mesh.vertices),
              "faces": len(mesh.faces),
              "boundary_edges": topology["boundary_edges"],
              "head_source_vertices": rel["required_head_source_vertices"],
              "upper_body_source_vertices": rel["required_upper_body_source_vertices"],
              "bounds": manifest["extraction"]["compact_actual_bounds"],
          }
          (root / "audit-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print("REAL HM08 FULL BODY PASS", summary)
          PY

      - name: Preserve full-body seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: hm08-full-body-seed
          if-no-files-found: error
          path: |
            build/hm08-full-body-seed/body.obj
            build/hm08-full-body-seed/source-index-map.json
            build/hm08-full-body-seed/seed-manifest.json
            build/hm08-full-body-seed/audit-summary.json
            build/hm08-full-body-seed/targets/*.target
