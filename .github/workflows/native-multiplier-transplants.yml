name: native-multiplier-transplants

on:
  push:
    paths:
      - "native_material_signal_audit.py"
      - "native_material_signal_audit_test.py"
      - "native_pbr_signal_review.py"
      - "native_pbr_signal_review_test.py"
      - "native_pbr_rehearsal.py"
      - "native_pbr_rehearsal_test.py"
      - "native_preview_evidence.py"
      - "native_preview_evidence_test.py"
      - "native_preview_resumable.py"
      - "native_preview_resumable_test.py"
      - "native_evidence_verify.py"
      - "native_evidence_verify_test.py"
      - "native_surface_families.py"
      - "native_surface_families_test.py"
      - "native_shared_glb_pack.py"
      - "native_shared_glb_pack_test.py"
      - "native_stencil_detail.py"
      - "native_stencil_detail_test.py"
      - "native_salvage_construction.py"
      - "native_salvage_construction_test.py"
      - "native_construction_kit.py"
      - "native_construction_kit_test.py"
      - "native_rigid_assembly.py"
      - "native_rigid_assembly_test.py"
      - "native_collision_contract.py"
      - "native_collision_contract_test.py"
      - "docs/CODE_MULTIPLIER_TRANSPLANTS.md"
      - "docs/NATIVE_PBR_REHEARSAL.md"
      - "docs/NATIVE_PREVIEW_EVIDENCE.md"
      - "docs/NATIVE_PREVIEW_RESUME.md"
      - "docs/UNIVERSAL_CREATION_RTS_DONORS.md"
      - "docs/NATIVE_SALVAGE_CONSTRUCTION.md"
      - "docs/NATIVE_CONSTRUCTION_KIT.md"
      - "docs/NATIVE_RIGID_ASSEMBLY.md"
      - "docs/NATIVE_COLLISION_CONTRACT.md"
      - ".github/workflows/native-multiplier-transplants.yml"
  pull_request:
    paths:
      - "native_material_signal_audit.py"
      - "native_material_signal_audit_test.py"
      - "native_pbr_signal_review.py"
      - "native_pbr_signal_review_test.py"
      - "native_pbr_rehearsal.py"
      - "native_pbr_rehearsal_test.py"
      - "native_preview_evidence.py"
      - "native_preview_evidence_test.py"
      - "native_preview_resumable.py"
      - "native_preview_resumable_test.py"
      - "native_evidence_verify.py"
      - "native_evidence_verify_test.py"
      - "native_surface_families.py"
      - "native_surface_families_test.py"
      - "native_shared_glb_pack.py"
      - "native_shared_glb_pack_test.py"
      - "native_stencil_detail.py"
      - "native_stencil_detail_test.py"
      - "native_salvage_construction.py"
      - "native_salvage_construction_test.py"
      - "native_construction_kit.py"
      - "native_construction_kit_test.py"
      - "native_rigid_assembly.py"
      - "native_rigid_assembly_test.py"
      - "native_collision_contract.py"
      - "native_collision_contract_test.py"
      - "docs/CODE_MULTIPLIER_TRANSPLANTS.md"
      - "docs/NATIVE_PBR_REHEARSAL.md"
      - "docs/NATIVE_PREVIEW_EVIDENCE.md"
      - "docs/NATIVE_PREVIEW_RESUME.md"
      - "docs/UNIVERSAL_CREATION_RTS_DONORS.md"
      - "docs/NATIVE_SALVAGE_CONSTRUCTION.md"
      - "docs/NATIVE_CONSTRUCTION_KIT.md"
      - "docs/NATIVE_RIGID_ASSEMBLY.md"
      - "docs/NATIVE_COLLISION_CONTRACT.md"
      - ".github/workflows/native-multiplier-transplants.yml"

jobs:
  transplanted-organs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Native material payload and signal audit tests
        run: python native_material_signal_audit_test.py
      - name: Native PBR signal-review integration tests
        run: python native_pbr_signal_review_test.py
      - name: Native PBR rehearsal integration tests
        run: python native_pbr_rehearsal_test.py
      - name: Native preview evidence integration tests
        run: python native_preview_evidence_test.py
      - name: Native preview resumability integration tests
        run: python native_preview_resumable_test.py
      - name: Native evidence bundle verification tests
        run: python native_evidence_verify_test.py
      - name: Universal Creation surface-family donor tests
        run: python native_surface_families_test.py
      - name: Universal Creation shared-GLB packaging donor tests
        run: python native_shared_glb_pack_test.py
      - name: Universal Creation geometric stencil donor tests
        run: python native_stencil_detail_test.py
      - name: Universal Creation salvage construction donor tests
        run: python native_salvage_construction_test.py
      - name: Universal Creation construction toolkit donor tests
        run: python native_construction_kit_test.py
      - name: Universal Creation rigid assembly donor tests
        run: python native_rigid_assembly_test.py
      - name: Universal Creation collision contract donor tests
        run: python native_collision_contract_test.py
