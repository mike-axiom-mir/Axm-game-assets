name: hm08-head-seed-v2

on:
  push:
    paths:
      - "tools/bootstrap_hm08_head_v2.py"
      - "tools/bootstrap_hm08_head_v2_test.py"
      - ".github/workflows/hm08-head-seed-v2.yml"
  pull_request:
    paths:
      - "tools/bootstrap_hm08_head_v2.py"
      - "tools/bootstrap_hm08_head_v2_test.py"
      - ".github/workflows/hm08-head-seed-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derive-repaired-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Unit-test v0.2 extraction repair
        run: python tools/bootstrap_hm08_head_v2_test.py

      - name: Download pinned CC0 hm08 source data
        env:
          MH_REV: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          MPFB_REV: 437dd513888a92399d1d3200d2e80859fae55abc
        run: |
          set -euo pipefail
          rm -rf build/hm08-source-v2 build/hm08-head-seed-v2
          mkdir -p build/hm08-source-v2
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/makehumancommunity/makehuman/${MH_REV}/makehuman/data/3dobjs/base.obj" \
            -o build/hm08-source-v2/base.obj
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/makehumancommunity/mpfb2/${MPFB_REV}/src/mpfb/data/mesh_metadata/hm08_config.json" \
            -o build/hm08-source-v2/hm08_config.json
          for target in \
            "nose/nose-width1-incr.target" \
            "cheek/l-cheek-bones-incr.target" \
            "cheek/r-cheek-bones-incr.target"
          do
            out="build/hm08-source-v2/$(basename "$target")"
            curl --fail --location --retry 3 \
              "https://raw.githubusercontent.com/makehumancommunity/makehuman/${MH_REV}/makehuman/data/targets/${target}" \
              -o "$out"
          done
          test "$(git hash-object build/hm08-source-v2/base.obj)" = "d26635e9326e3cca30778fd7b9c00062b03cce09"
          test "$(git hash-object build/hm08-source-v2/hm08_config.json)" = "f94e2731356232ed1b6306128fd04d18da5d21ea"

      - name: Derive repaired head and remap face targets
        env:
          MH_REV: a8bc2d54ff0ac92e78ff71431b1023eda42bf482
          MPFB_REV: 437dd513888a92399d1d3200d2e80859fae55abc
        run: |
          python tools/bootstrap_hm08_head_v2.py \
            --base-obj build/hm08-source-v2/base.obj \
            --config-json build/hm08-source-v2/hm08_config.json \
            --target build/hm08-source-v2/nose-width1-incr.target \
            --target build/hm08-source-v2/l-cheek-bones-incr.target \
            --target build/hm08-source-v2/r-cheek-bones-incr.target \
            --output build/hm08-head-seed-v2 \
            --makehuman-revision "$MH_REV" \
            --mpfb-revision "$MPFB_REV"

      - name: Audit repaired topology and compare v0.1 boundary damage
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          from native_geometry import read_obj, topology_report
          from native_targets import load_target, validate_target

          root = Path("build/hm08-head-seed-v2")
          manifest = json.loads((root / "seed-manifest.json").read_text())
          assert all(manifest["acceptance"].values()), manifest["acceptance"]
          mesh = read_obj(root / "head.obj")
          topology = topology_report(mesh)
          assert topology["invalid_indices"] == 0, topology
          assert topology["degenerate_faces"] == 0, topology
          assert topology["nonmanifold_edges"] == 0, topology
          assert topology["boundary_edges"] > 0, topology
          assert len(mesh.vertices) > 3423, "v0.2 should recover geometry clipped from v0.1"
          assert len(mesh.faces) > 3246, "v0.2 should recover faces clipped from v0.1"
          assert topology["boundary_edges"] < 374, "v0.2 should reduce artificial v0.1 crop boundaries"

          edges = defaultdict(int)
          for face in mesh.faces:
              for i, a in enumerate(face):
                  b = face[(i + 1) % len(face)]
                  edges[tuple(sorted((a, b)))] += 1
          boundary = [edge for edge, count in edges.items() if count == 1]
          adjacency = defaultdict(set)
          for a, b in boundary:
              adjacency[a].add(b); adjacency[b].add(a)
          seen = set(); components = []
          for start in adjacency:
              if start in seen: continue
              stack = [start]; seen.add(start); comp = []
              while stack:
                  current = stack.pop(); comp.append(current)
                  for neighbor in adjacency[current]:
                      if neighbor not in seen:
                          seen.add(neighbor); stack.append(neighbor)
              components.append(comp)

          for target_path in sorted((root / "targets").glob("*.target")):
              target = load_target(target_path, license="CC0-source-remap")
              assert target.metadata["basemesh"] == "axm-hm08-head-v0.2"
              report = validate_target(target, vertex_count=len(mesh.vertices))
              assert report["status"] == "pass", report
              assert report["rows"] > 0

          comparison = {
              "v0_1": {"vertices":3423,"faces":3246,"boundary_edges":374},
              "v0_2": {
                  "vertices":len(mesh.vertices),
                  "faces":len(mesh.faces),
                  "boundary_edges":topology["boundary_edges"],
                  "boundary_components":len(components),
                  "largest_boundary_components":sorted((len(c) for c in components), reverse=True)[:12],
              },
          }
          (root / "repair-comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          print("REAL HM08 HEAD V0.2 PASS", comparison)
          PY

      - name: Preserve repaired seed evidence
        uses: actions/upload-artifact@v4
        with:
          name: hm08-head-seed-v2
          if-no-files-found: error
          path: |
            build/hm08-head-seed-v2/head.obj
            build/hm08-head-seed-v2/source-index-map.json
            build/hm08-head-seed-v2/seed-manifest.json
            build/hm08-head-seed-v2/repair-comparison.json
            build/hm08-head-seed-v2/targets/*.target

      - name: Promote audited v0.2 seed beside rejected v0.1
        if: github.event_name == 'push' && github.ref_name == 'forge/chat-2026-09-08-sentinel-fidelity'
        run: |
          set -euo pipefail
          rm -rf seed_data/hm08_head_v0.2
          mkdir -p seed_data/hm08_head_v0.2
          cp -R build/hm08-head-seed-v2/. seed_data/hm08_head_v0.2/
          git config user.name "axm-forge-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed_data/hm08_head_v0.2
          if git diff --cached --quiet; then
            echo "Audited v0.2 seed already matches repository state."
            exit 0
          fi
          git commit -m "data: pin repaired hm08 human head seed v0.2"
          git push origin HEAD:"${GITHUB_REF_NAME}"
