name: humanoid-skin-v2-tests

on:
  push:
    paths:
      - "native_hm08_humanoid_rig.py"
      - "native_hm08_humanoid_rig_test.py"
      - "native_hm08_humanoid_skin_v2.py"
      - "native_hm08_humanoid_skin_v2_test.py"
      - ".github/workflows/humanoid-skin-v2-tests.yml"
  pull_request:
    paths:
      - "native_hm08_humanoid_rig.py"
      - "native_hm08_humanoid_rig_test.py"
      - "native_hm08_humanoid_skin_v2.py"
      - "native_hm08_humanoid_skin_v2_test.py"
      - ".github/workflows/humanoid-skin-v2-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segment-skin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python native_hm08_humanoid_rig_test.py
      - run: python native_hm08_humanoid_skin_v2_test.py
