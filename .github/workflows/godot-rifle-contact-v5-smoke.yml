name: godot-rifle-contact-v5-smoke

on:
  push:
    paths:
      - "native_hm08_rifle_contact_pose_v5.py"
      - "native_hm08_rifle_contact_pose_v5_test.py"
      - "native_hm08_rifle_contact_package_v5.py"
      - "native_hm08_rifle_contact_package_v5_test.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - "engine/godot_face/render_rifle_contact_v3_views.gd"
      - ".github/workflows/godot-rifle-contact-v5-smoke.yml"
  pull_request:
    paths:
      - "native_hm08_rifle_contact_pose_v5.py"
      - "native_hm08_rifle_contact_pose_v5_test.py"
      - "native_hm08_rifle_contact_package_v5.py"
      - "native_hm08_rifle_contact_package_v5_test.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - "engine/godot_face/render_rifle_contact_v3_views.gd"
      - ".github/workflows/godot-rifle-contact-v5-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-rifle-contact-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gate source-grounded finger grip v0.5
        run: |
          python native_hm08_finger_rig_test.py
          python native_hm08_rifle_contact_pose_v5_test.py
          python native_hm08_rifle_contact_package_v5_test.py
          python - <<'PY'
          from native_hm08_rifle_contact_package_v5 import CHANGED_VARIABLE, build_hm08_rifle_contact_package_v5
          package = build_hm08_rifle_contact_package_v5("engine/godot_face/generated", texture_size=128)
          assert all(package["acceptance"].values()), package["acceptance"]
          assert package["schema"] == "axm.game-assets.hm08-rifle-contact-package.v0.5"
          assert package["candidate_role"] == "source_grounded_finger_grip_visual_proof"
          assert package["changed_variable_from_v0_4"] == CHANGED_VARIABLE
          assert package["pose"]["shared_rig"]["joint_count"] == 53
          assert package["pose"]["shared_rig"]["finger_joint_count"] == 30
          assert package["rifle"]["scale"] == [1.0, 1.0, 1.0]
          assert package["delivery"]["primitive_count"] == 5
          grip = package["pose"]["finger_grip"]
          print("FINGER-GRIP V0.5 BUILD PASS", {
              "minimum_tip_improvement_mm": grip["minimum_fingertip_improvement_m"] * 1000.0,
              "mean_tip_improvement_mm": grip["mean_fingertip_improvement_m"] * 1000.0,
              "max_curl_mm": grip["finger_curl_max_displacement_m"] * 1000.0,
              "delivery": package["delivery"],
          })
          PY

      - name: Derive v0.5 renderer from preserved v0.4 camera lab
        run: |
          python - <<'PY'
          from pathlib import Path
          from native_hm08_rifle_contact_package_v5 import CHANGED_VARIABLE
          src = Path("engine/godot_face/render_rifle_contact_v3_views.gd").read_text()
          replacements = {
              "sentinel_hm08_rifle_contact_v0_3.gltf": "sentinel_hm08_rifle_contact_v0_5.gltf",
              "rifle-contact-package-v3.json": "rifle-contact-package-v5.json",
              "godot-rifle-contact-v3-views-receipt.json": "godot-rifle-contact-v5-views-receipt.json",
              "godot-rifle-contact-v3-%s.png": "godot-rifle-contact-v5-%s.png",
              "human_scale_rifle_source_dimensions": CHANGED_VARIABLE,
              "A/B successor to the preserved oversized-rifle v0.2 viewset. Shared rig, palm-socket mechanism and camera class remain; only the authored rifle dimensions change.": "A/B successor to preserved rifle-contact v0.4. Human-scale rifle geometry/materials/transform, shoulder-elbow-wrist pose, lighting and camera class remain; only source-grounded finger-joint rotations change after the merged finger-skin baseline.",
              "v0.3 rifle contact asset/package missing": "v0.5 rifle contact asset/package missing",
              "v0.3 package invalid JSON": "v0.5 package invalid JSON",
              "Godot rejected v0.3 rifle contact glTF": "Godot rejected v0.5 rifle contact glTF",
              "Godot generated no v0.3 contact scene": "Godot generated no v0.5 contact scene",
              "v0.3 contact scene has no bounds": "v0.5 contact scene has no bounds",
              "v0.3 contact scene missing five material surfaces": "v0.5 contact scene missing five material surfaces",
              "v0.3 rifle contact view %s failed technical gate": "v0.5 rifle contact view %s failed technical gate",
              "FORGE GODOT HUMAN-SCALE RIFLE CONTACT PASS": "FORGE GODOT FINGER-GRIP RIFLE CONTACT PASS",
          }
          for old, new in replacements.items():
              if old not in src:
                  raise SystemExit(f"renderer template contract missing: {old}")
              src = src.replace(old, new)
          out = Path("engine/godot_face/render_rifle_contact_v5_runtime.gd")
          out.write_text(src)
          print("V0.5 RENDERER DERIVED", out)
          PY

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" -o .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Render finger-grip A/B views
        run: |
          rm -f engine/godot_face/godot-rifle-contact-v5-*.png engine/godot_face/godot-rifle-contact-v5-views-receipt.json
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 640x640x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path engine/godot_face \
            --script render_rifle_contact_v5_runtime.gd
          python - <<'PY'
          import json
          from pathlib import Path
          from native_hm08_rifle_contact_package_v5 import CHANGED_VARIABLE
          receipt = json.loads(Path("engine/godot_face/godot-rifle-contact-v5-views-receipt.json").read_text())
          assert receipt["status"] == "pass", receipt
          assert receipt["changed_variable"] == CHANGED_VARIABLE
          assert receipt["surfaces"] == 5 and receipt["material_surfaces"] == 5
          assert [view["name"] for view in receipt["views"]] == ["front_contact", "three_quarter_contact", "hands_close"]
          for view in receipt["views"]:
              metrics = view["metrics"]
              assert metrics["foreground_coverage"] >= view["minimum_foreground_coverage"]
              assert metrics["near_white_foreground_fraction"] <= view["maximum_near_white_foreground_fraction"]
          print("GODOT FINGER-GRIP V0.5 PASS", [(view["name"], view["metrics"]["foreground_coverage"]) for view in receipt["views"]])
          PY

      - name: Bind v0.5 captures
        env:
          GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from native_hm08_rifle_contact_package_v5 import CHANGED_VARIABLE
          from native_visual_evidence import build_capture_packet, validate_capture_packet, write_capture_packet

          root = Path("engine/godot_face")
          receipt = json.loads((root / "godot-rifle-contact-v5-views-receipt.json").read_text())
          package_path = root / "generated" / "rifle-contact-package-v5.json"
          package = json.loads(package_path.read_text())
          source_digest = "sha256:" + hashlib.sha256(package_path.read_bytes()).hexdigest()
          grip = package["pose"]["finger_grip"]
          bundle = {
              "schema": "axm.game-assets.godot-rifle-contact-viewset.v0.5",
              "authority": "deterministic_capture_evidence_only",
              "asset_digest": package["delivery"]["gltf_sha256"],
              "changed_variable": CHANGED_VARIABLE,
              "finger_rig": {
                  "joint_count": package["pose"]["shared_rig"]["joint_count"],
                  "finger_joint_count": package["pose"]["shared_rig"]["finger_joint_count"],
                  "minimum_fingertip_improvement_m": grip["minimum_fingertip_improvement_m"],
                  "mean_fingertip_improvement_m": grip["mean_fingertip_improvement_m"],
              },
              "v0_4_reference": grip["v0_4_arm_and_weapon_reference"],
              "views": [],
              "truth": "v0.5 uses the preserved v0.4 camera/light class and unchanged rifle source/materials/transform. Deterministic capture facts do not claim that the finger grip is visually correct; hand-close inspection remains the promotion boundary."
          }
          for view in receipt["views"]:
              name = view["name"]
              png_path = root / f"godot-rifle-contact-v5-{name}.png"
              png = png_path.read_bytes()
              metrics = view["metrics"]
              packet = build_capture_packet(
                  png,
                  asset_digest=package["delivery"]["gltf_sha256"],
                  engine={"name": "Godot", "version": receipt["godot_version"], "pinned_archive_sha256": os.environ["GODOT_ARCHIVE_SHA256"]},
                  camera=view["camera"],
                  render_settings={"renderer": "gl_compatibility", "view_name": name, "layer": "source_grounded_finger_grip_v0.5", "lighting": receipt["lighting"], "foreground_gate": receipt["foreground_gate"]},
                  metrics={"foreground_coverage": metrics["foreground_coverage"], "foreground_luma_mean": metrics["foreground_luma_mean"], "near_white_foreground_fraction": metrics["near_white_foreground_fraction"], "luma_min": metrics["luma_min"], "luma_max": metrics["luma_max"], "luma_mean": metrics["luma_mean"], "luma_range": metrics["luma_range"]},
                  source_receipts=[source_digest],
              )
              assert validate_capture_packet(packet, png)["status"] == "pass"
              write_capture_packet(root / f"visual-capture-rifle-contact-v5-{name}.json", packet)
              bundle["views"].append({"name": name, "capture_digest": packet["capture_digest"], "image_sha256": packet["image"]["sha256"]})
          (root / "visual-capture-rifle-contact-v5-viewset.json").write_text(json.dumps(bundle, indent=2, sort_keys=True) + "\n")
          print("FINGER-GRIP V0.5 CAPTURE PASS", bundle)
          PY

      - name: Preserve finger-grip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-rifle-contact-v5-evidence
          if-no-files-found: error
          path: |
            engine/godot_face/godot-rifle-contact-v5-views-receipt.json
            engine/godot_face/godot-rifle-contact-v5-*.png
            engine/godot_face/visual-capture-rifle-contact-v5-*.json
            engine/godot_face/render_rifle_contact_v5_runtime.gd
            engine/godot_face/generated/rifle-contact-package-v5.json
            engine/godot_face/generated/sentinel_hm08_rifle_contact_v0_5.gltf
            engine/godot_face/generated/sentinel_hm08_rifle_contact_v0_5.bin
            engine/godot_face/generated/textures/contact_body/*
            engine/godot_face/generated/textures/rifle/**/*
