name: godot-full-body-current-smoke

on:
  push:
    paths:
      - "native_hm08_full_body_current.py"
      - "native_hm08_full_body_current_test.py"
      - "native_hm08_full_body_seed_test.py"
      - "native_hm08_undersuit.py"
      - "native_hm08_undersuit_test.py"
      - "native_hm08_sentinel_armor.py"
      - "native_hm08_sentinel_armor_test.py"
      - "native_hm08_extremity_gear.py"
      - "native_hm08_extremity_gear_test.py"
      - "native_fabric_material.py"
      - "native_hardsurface.py"
      - "native_pbr.py"
      - "seed_data/hm08_full_body_v0.1/**"
      - "engine/godot_face/render_full_body_views.gd"
      - ".github/workflows/godot-full-body-current-smoke.yml"
  pull_request:
    paths:
      - "native_hm08_full_body_current.py"
      - "native_hm08_full_body_current_test.py"
      - "native_hm08_full_body_seed_test.py"
      - "native_hm08_undersuit.py"
      - "native_hm08_undersuit_test.py"
      - "native_hm08_sentinel_armor.py"
      - "native_hm08_sentinel_armor_test.py"
      - "native_hm08_extremity_gear.py"
      - "native_hm08_extremity_gear_test.py"
      - "native_fabric_material.py"
      - "native_hardsurface.py"
      - "native_pbr.py"
      - "seed_data/hm08_full_body_v0.1/**"
      - "engine/godot_face/render_full_body_views.gd"
      - ".github/workflows/godot-full-body-current-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-full-body-current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build equipped Sentinel body candidate
        run: |
          rm -rf engine/godot_face/generated
          python native_hm08_full_body_seed_test.py
          python native_hm08_undersuit_test.py
          python native_hm08_sentinel_armor_test.py
          python native_hm08_extremity_gear_test.py
          python native_hm08_full_body_current_test.py
          python - <<'PY'
          from native_hm08_full_body_current import build_current_full_body_package
          package = build_current_full_body_package("engine/godot_face/generated", texture_size=128)
          assert all(package["acceptance"].values()), package["acceptance"]
          assert package["schema"] == "axm.game-assets.hm08-full-body-current.v0.4"
          assert package["candidate_role"] == "sentinel_equipped_body_candidate"
          assert package["head_identity_overlap"]["compared_vertices"] == 4197
          assert package["head_identity_overlap"]["max_error_raw"] <= 1e-12
          assert package["upper_body_identity_overlap"]["compared_vertices"] == 10185
          assert package["upper_body_identity_overlap"]["max_error_raw"] <= 1e-12
          assert package["full_seed"]["source_vertices"] == 13380
          assert package["full_seed"]["source_faces"] == 13378
          assert package["undersuit"]["surface_coverage_fraction"] > 0.70
          assert package["rigid_armor"]["schema"] == "axm.game-assets.hm08-sentinel-rigid-armor.v0.2"
          assert package["rigid_armor"]["primary_component_count"] >= 20
          assert package["rigid_armor"]["accent_component_count"] >= 12
          assert package["extremity_gear"]["glove_face_count"] > 3000
          assert package["extremity_gear"]["boot_upper_face_count"] > 2000
          assert package["extremity_gear"]["truth"]["canonical_body_mutated"] is False
          assert package["delivery"]["primitive_count"] == 14
          assert package["delivery"]["material_count"] == 14
          names = package["delivery"]["material_names"]
          assert names[1] == "AXM_Sentinel_Graphite_Undersuit_v0_1"
          assert names[2] == "AXM_Sentinel_Armor_Primary_v0_2"
          assert names[3] == "AXM_Sentinel_Armor_Accent_v0_2"
          assert names[4] == "AXM_Sentinel_Gloves_BootUppers_v0_1"
          assert names[5] == "AXM_Sentinel_BootSoles_v0_1"
          print("EQUIPPED SENTINEL BODY BUILD PASS", package["head_identity_overlap"], package["upper_body_identity_overlap"], package["undersuit"], package["rigid_armor"], package["extremity_gear"], package["delivery"])
          PY
          cp \
            engine/godot_face/generated/sentinel_hm08_full_body_current_v0_4.gltf \
            engine/godot_face/generated/sentinel_hm08_face_candidate_v0_1.gltf

      - name: Download pinned Godot 4.7.2
        env:
          GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          mkdir -p .godot-bin
          curl --fail --location --retry 3 --retry-delay 2 "$GODOT_URL" --output .godot-bin/godot.zip
          echo "$GODOT_SHA256  .godot-bin/godot.zip" | sha256sum --check --strict
          unzip -q .godot-bin/godot.zip -d .godot-bin
          chmod +x .godot-bin/Godot_v4.7.2-stable_linux.x86_64
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Parse equipped Sentinel body in Godot
        run: |
          rm -f engine/godot_face/godot-face-eyes-import-receipt.json
          .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path engine/godot_face \
            --script smoke_eyes.gd
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("engine/godot_face/godot-face-eyes-import-receipt.json").read_text())
          assert receipt["status"] == "pass", receipt
          assert receipt["surfaces"] == 14, receipt
          assert receipt["material_surfaces"] == 14, receipt
          assert len(receipt["declared_external_images"]) == 42, receipt
          assert receipt["vertices"] > 75000, receipt
          assert receipt["indices"] > 75000, receipt
          print("EQUIPPED SENTINEL GODOT IMPORT PASS", receipt)
          PY

      - name: Render equipped Sentinel views
        run: |
          rm -f engine/godot_face/godot-full-body-views-receipt.json engine/godot_face/godot-full-body-front.png engine/godot_face/godot-full-body-three_quarter.png engine/godot_face/godot-full-body-profile.png
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --auto-servernum --server-args="-screen 0 640x640x24" \
            .godot-bin/Godot_v4.7.2-stable_linux.x86_64 \
            --display-driver x11 \
            --rendering-method gl_compatibility \
            --path engine/godot_face \
            --script render_full_body_views.gd
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("engine/godot_face/godot-full-body-views-receipt.json").read_text())
          assert receipt["status"] == "pass", receipt
          assert receipt["schema"] == "axm.game-assets.godot-full-body-views.v0.2"
          assert receipt["foreground_gate"]["delta_threshold"] == 0.01
          assert [v["name"] for v in receipt["views"]] == ["front", "three_quarter", "profile"]
          for view in receipt["views"]:
              metrics = view["metrics"]
              assert metrics["foreground_coverage"] >= view["minimum_foreground_coverage"]
              assert metrics["near_white_foreground_fraction"] <= view["maximum_near_white_foreground_fraction"]
          print("EQUIPPED SENTINEL VIEWS PASS", [(v["name"],v["metrics"]["foreground_coverage"],v["metrics"]["near_white_foreground_fraction"]) for v in receipt["views"]])
          PY

      - name: Bind equipped-character captures to evidence packets
        env:
          GODOT_ARCHIVE_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from native_visual_evidence import build_capture_packet, validate_capture_packet, write_capture_packet
          root = Path("engine/godot_face")
          receipt = json.loads((root / "godot-full-body-views-receipt.json").read_text())
          package_path = root / "generated" / "full-body-package.json"
          package = json.loads(package_path.read_text())
          source_digest = "sha256:" + hashlib.sha256(package_path.read_bytes()).hexdigest()
          bundle = {
              "schema":"axm.game-assets.godot-equipped-body-viewset.v0.4",
              "authority":"deterministic_capture_evidence_only",
              "asset_digest":package["delivery"]["gltf_sha256"],
              "candidate_role":package["candidate_role"],
              "head_identity_overlap":package["head_identity_overlap"],
              "upper_body_identity_overlap":package["upper_body_identity_overlap"],
              "undersuit":{"surface_coverage_fraction":package["undersuit"]["surface_coverage_fraction"],"offset_m":package["undersuit"]["offset_m"]},
              "armor":{"schema":package["rigid_armor"]["schema"],"primary_components":package["rigid_armor"]["primary_component_count"],"accent_components":package["rigid_armor"]["accent_component_count"],"anchors_m":package["rigid_armor"]["anchors_m"]},
              "extremity_gear":{"schema":package["extremity_gear"]["schema"],"glove_faces":package["extremity_gear"]["glove_face_count"],"boot_upper_faces":package["extremity_gear"]["boot_upper_face_count"],"shell_offset_m":package["extremity_gear"]["shell_offset_m"]},
              "foreground_gate":receipt["foreground_gate"],
              "views":[],
              "truth":"Godot proves import/render/capture facts for segmented armor plus source-derived gloves and boots. It does not promote final fit, finger articulation, sole tread, rigging, weapon contact or AAA quality."
          }
          for view in receipt["views"]:
              name=view["name"]
              png_path=root/f"godot-full-body-{name}.png"
              png=png_path.read_bytes(); metrics=view["metrics"]
              packet=build_capture_packet(
                  png,
                  asset_digest=package["delivery"]["gltf_sha256"],
                  engine={"name":"Godot","version":receipt["godot_version"],"pinned_archive_sha256":os.environ["GODOT_ARCHIVE_SHA256"]},
                  camera=view["camera"],
                  render_settings={"renderer":"gl_compatibility","view_name":name,"world_bounds":receipt["world_bounds"],"layer":"sentinel_equipped_body_v0.4","lighting":receipt["lighting"],"foreground_gate":receipt["foreground_gate"]},
                  metrics={"foreground_coverage":metrics["foreground_coverage"],"foreground_luma_mean":metrics["foreground_luma_mean"],"near_white_foreground_fraction":metrics["near_white_foreground_fraction"],"luma_min":metrics["luma_min"],"luma_max":metrics["luma_max"],"luma_mean":metrics["luma_mean"],"luma_range":metrics["luma_range"]},
                  source_receipts=[source_digest],
              )
              assert validate_capture_packet(packet,png)["status"]=="pass"
              write_capture_packet(root/f"visual-capture-full-body-{name}.json",packet)
              bundle["views"].append({"name":name,"capture_digest":packet["capture_digest"],"image_sha256":packet["image"]["sha256"]})
          (root/"visual-capture-full-body-viewset.json").write_text(json.dumps(bundle,indent=2,sort_keys=True)+"\n")
          print("EQUIPPED SENTINEL CAPTURE PASS",bundle)
          PY

      - name: Preserve equipped Sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-full-body-current-evidence
          if-no-files-found: warn
          path: |
            engine/godot_face/godot-face-eyes-import-receipt.json
            engine/godot_face/godot-full-body-views-receipt.json
            engine/godot_face/godot-full-body-front.png
            engine/godot_face/godot-full-body-three_quarter.png
            engine/godot_face/godot-full-body-profile.png
            engine/godot_face/visual-capture-full-body-*.json
            engine/godot_face/generated/full-body-package.json
            engine/godot_face/generated/sentinel_hm08_full_body_current_v0_4.gltf
            engine/godot_face/generated/sentinel_hm08_full_body_current_v0_4.bin
            engine/godot_face/generated/textures/skin/*
            engine/godot_face/generated/textures/undersuit/*
            engine/godot_face/generated/textures/armor/primary/*
            engine/godot_face/generated/textures/armor/accent/*
            engine/godot_face/generated/textures/extremity/textile/*
            engine/godot_face/generated/textures/extremity/rubber/*
            engine/godot_face/generated/textures/eyes/*
            engine/godot_face/generated/textures/brows/*
            engine/godot_face/generated/textures/lashes/*
            engine/godot_face/generated/textures/scalp_underlay/*
            engine/godot_face/generated/textures/scalp_hair/*
