name: hm08-finger-rig-tests

on:
  push:
    paths:
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - "native_hm08_humanoid_rig.py"
      - "native_hm08_humanoid_skin_v2.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - ".github/workflows/hm08-finger-rig-tests.yml"
  pull_request:
    paths:
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - "native_hm08_humanoid_rig.py"
      - "native_hm08_humanoid_skin_v2.py"
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - ".github/workflows/hm08-finger-rig-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finger-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prove promoted arm substrate
        run: python native_hm08_humanoid_skin_v2_test.py
      - name: Prove source-grounded finger rig and weights
        run: python native_hm08_finger_rig_test.py
