name: finger-grip-tests

on:
  push:
    paths:
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - "native_hm08_rifle_contact_pose_v5.py"
      - "native_hm08_rifle_contact_pose_v5_test.py"
      - "native_hm08_rifle_contact_package_v5.py"
      - "native_hm08_rifle_contact_package_v5_test.py"
      - "native_hm08_rifle_contact_pose_v6.py"
      - "native_hm08_rifle_contact_pose_v6_test.py"
      - "native_hm08_rifle_contact_pose_v7.py"
      - "native_hm08_rifle_contact_pose_v7_test.py"
      - "native_hm08_rifle_contact_pose_v8.py"
      - "native_hm08_rifle_contact_pose_v8_test.py"
      - "native_hm08_grip_palm_diagnostic.py"
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - ".github/workflows/finger-grip-tests.yml"
  pull_request:
    paths:
      - "native_hm08_finger_rig.py"
      - "native_hm08_finger_rig_test.py"
      - "native_hm08_rifle_contact_pose_v5.py"
      - "native_hm08_rifle_contact_pose_v5_test.py"
      - "native_hm08_rifle_contact_package_v5.py"
      - "native_hm08_rifle_contact_package_v5_test.py"
      - "native_hm08_rifle_contact_pose_v6.py"
      - "native_hm08_rifle_contact_pose_v6_test.py"
      - "native_hm08_rifle_contact_pose_v7.py"
      - "native_hm08_rifle_contact_pose_v7_test.py"
      - "native_hm08_rifle_contact_pose_v8.py"
      - "native_hm08_rifle_contact_pose_v8_test.py"
      - "native_hm08_grip_palm_diagnostic.py"
      - "seed_data/hm08_finger_landmarks_v0.1/**"
      - ".github/workflows/finger-grip-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finger-grip:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Source-grounded finger rig and skin
        run: python native_hm08_finger_rig_test.py
      - name: V5 socket-center grip retained mechanical proof
        run: python native_hm08_rifle_contact_pose_v5_test.py
      - name: V5 Godot package determinism
        run: python native_hm08_rifle_contact_package_v5_test.py
      - name: V6 expected center-palm collision rejection proof
        run: python native_hm08_rifle_contact_pose_v6_test.py
      - name: Measure v7 open-palm plane against real grip volumes
        run: python native_hm08_grip_palm_diagnostic.py
      - name: V7 expected edge-on palm rejection proof
        run: python native_hm08_rifle_contact_pose_v7_test.py
      - name: V8 palm-plane aligned physical grip proposal
        run: python native_hm08_rifle_contact_pose_v8_test.py
